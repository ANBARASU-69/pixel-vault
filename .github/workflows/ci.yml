name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pixel-vault

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pixel-vault .

      - name: Smoke test
        run: |
          docker run -d -p 3000:3000 --name pv pixel-vault
          sleep 8
          curl -f http://localhost:3000/api/games

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        if: github.event_name == 'push'
        run: |
          REGISTRY=${{ steps.ecr-login.outputs.registry }}
          docker tag pixel-vault $REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker tag pixel-vault $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      - name: Deploy to EC2 via SSM
        if: github.event_name == 'push'
        run: |
          REGISTRY=${{ steps.ecr-login.outputs.registry }}
          cat > params.json <<EOF
          {"commands":[
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $REGISTRY",
            "docker pull $REGISTRY/pixel-vault:latest",
            "docker rm -f pv || true",
            "docker run -d -p 80:3000 -v pixelvault-data:/app/data --restart unless-stopped --name pv $REGISTRY/pixel-vault:latest"
          ]}
          EOF
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --region us-east-1
